<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b61a8" />
  <meta name="description" content="More than Measured™ by Serenity Valley Works — an autism caregiver village focused on strengths, growth, and support." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=0.9.6" />
  <title>More than Measured™</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-leading"><button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button><button id="backBtn" class="page-back hidden" type="button" aria-label="Go back">← Back</button></div>
      <button id="homeBadge" class="brand-mini hidden" type="button" aria-label="Return to the More than Measured trademark homepage"><img src="assets/icons/icon-192.png" alt="" width="50" height="50"></button>
      <button id="installBtn" class="icon-btn hidden" aria-label="Install app">⬇</button>
    </header>

    <aside id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div class="drawer-brand"><strong>More than Measured™</strong><small>by Serenity Valley Works</small></div>
        <button id="closeDrawer" class="icon-btn" aria-label="Close menu">✕</button>
      </div>
      <nav id="drawerNav"></nav>
      <div class="drawer-version">Version <span id="drawerVersion"></span></div>
    </aside>
    <div id="scrim" class="scrim hidden"></div>

    <main id="view" class="view" tabindex="-1"></main>

  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" value="cancel" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <dialog id="imageViewer" class="image-viewer" aria-label="Image viewer">
    <div class="image-viewer-toolbar">
      <button id="closeImageViewer" class="image-viewer-close" type="button">✕ Close</button>
      <div class="image-viewer-controls" aria-label="Zoom controls">
        <button id="imageZoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="imageZoomReset" type="button">Fit</button>
        <button id="imageZoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>
    <p class="image-viewer-hint">Pinch or use the controls to zoom. Drag or scroll to move around the image.</p>
    <div id="imageViewerViewport" class="image-viewer-viewport">
      <img id="imageViewerImage" alt="" />
    </div>
  </dialog>

  <input id="restoreInput" type="file" accept=".ftbmbackup,.json,application/json" hidden />
  <script src="sync.js?v=0.9.6" defer></script>
  <script src="app.js?v=0.9.6" defer></script>
</body>
</html>
